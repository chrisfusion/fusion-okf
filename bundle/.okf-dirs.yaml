# Headings and descriptions for the generated index.md files (tools/okf_check.py index).
# Key = bundle-relative directory ("." = bundle root).
".":
  title: fusion-platform knowledge bundle
platform:
  title: Platform
  description: What the platform is, how the services fit together and the end-to-end artifact flow.
services:
  title: Services
  description: One page per fusion-* repository - purpose, interfaces, dependencies, deployment.
contracts:
  title: Contracts
  description: Shapes shared between services - manifests, naming, env vars, headers, labels.
contracts/crds:
  title: Custom resources
  description: The eleven CRDs of forge, weave and wizard, who writes and who reads them.
glossary:
  title: Glossary
  description: Platform terms, one page per term.
issues:
  title: Known issues
  description: Verified bugs, inconsistencies and stale documentation across repos, each with cause, impact and fix.
conventions:
  title: Conventions
  description: Rules every repo follows - offline builds, logging, changelog and releases, Helm and CRDs, operators, health endpoints.
operations:
  title: Operations
  description: Running the platform locally - minikube, per-service deploys, Postgres, DNS, Gitea and Flux.
decisions:
  title: Decisions
  description: Architecture decisions the sources state explicitly, with status (accepted or proposed), context and consequences.
apis:
  title: REST APIs
  description: One page per service API - base path, auth, route groups and gotchas, linking to the OpenAPI file or router instead of copying it.
